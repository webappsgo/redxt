name: Docker Build

on:
  push:
    # ALL branches
    branches: ['**']
    tags:
      - 'v*'
      - '*.*.*'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: docker-${{ forgejo.ref }}-${{ forgejo.event_name }}
  cancel-in-progress: ${{ forgejo.event_name != 'schedule' && !startsWith(forgejo.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  REGISTRY: ${{ forgejo.server_url }}

jobs:
  build-standard:
    runs-on: docker
    if: forgejo.event_name != 'schedule'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to Container Registry
        env:
          REGISTRY_URL: ${{ forgejo.server_url }}
          REGISTRY_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          REGISTRY_HOST="${REGISTRY_URL#https://}"
          REGISTRY_HOST="${REGISTRY_HOST#http://}"
          REGISTRY_HOST="${REGISTRY_HOST%%/*}"
          echo "REGISTRY_HOST=$REGISTRY_HOST" >> "$GITHUB_ENV"
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY_HOST" -u "${{ forgejo.repository_owner }}" --password-stdin

      - name: Set build info
        id: metadata
        run: |
          # ghcr.io requires a lowercase image path
          IMAGE_NAME=$(echo "${{ forgejo.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          PROJECT_NAME="${{ forgejo.event.repository.name }}"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"
          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          COMMIT_ID=$(git rev-parse --short=7 HEAD)
          echo "COMMIT_ID=$COMMIT_ID" >> "$GITHUB_ENV"
          echo "commit_id=$COMMIT_ID" >> "$GITHUB_OUTPUT"
          YYMM=$(date +"%y%m")
          echo "YYMM=$YYMM" >> "$GITHUB_ENV"
          echo "yymm=$YYMM" >> "$GITHUB_OUTPUT"
          if [[ "${{ forgejo.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
            IS_TAG=true
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
            echo "IS_TAG=$IS_TAG" >> "$GITHUB_ENV"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_tag=$IS_TAG" >> "$GITHUB_OUTPUT"
          else
            VERSION="$COMMIT_ID"
            IS_TAG=false
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
            echo "IS_TAG=$IS_TAG" >> "$GITHUB_ENV"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_tag=$IS_TAG" >> "$GITHUB_OUTPUT"
          fi
          BUILD_EPOCH=$(date -u +%s)
          BUILD_DATE=$(date -u -d @$BUILD_EPOCH +"%Y-%m-%dT%H:%M:%SZ")
          echo "BUILD_EPOCH=$BUILD_EPOCH" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
          echo "build_epoch=$BUILD_EPOCH" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

      - name: Determine tags (standard)
        id: tags
        run: |
          TAGS="$REGISTRY_HOST/${IMAGE_NAME}:${COMMIT_ID}"

          if [[ "${IS_TAG}" == "true" ]]; then
            TAGS="$TAGS,$REGISTRY_HOST/${IMAGE_NAME}:${VERSION}"
            TAGS="$TAGS,$REGISTRY_HOST/${IMAGE_NAME}:latest"
            TAGS="$TAGS,$REGISTRY_HOST/${IMAGE_NAME}:${YYMM}"
          else
            TAGS="$TAGS,$REGISTRY_HOST/${IMAGE_NAME}:devel"
            if [[ "${{ forgejo.ref }}" == refs/heads/beta ]]; then
              TAGS="$TAGS,$REGISTRY_HOST/${IMAGE_NAME}:beta"
            fi
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push (standard)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
            BUILD_EPOCH=${{ steps.metadata.outputs.build_epoch }}
            COMMIT_ID=${{ steps.metadata.outputs.commit_id }}
          labels: |
            org.opencontainers.image.vendor=${{ forgejo.repository_owner }}
            org.opencontainers.image.authors=${{ forgejo.repository_owner }}
            org.opencontainers.image.title=${{ steps.metadata.outputs.project_name }}
            org.opencontainers.image.base.name=${{ steps.metadata.outputs.project_name }}
            org.opencontainers.image.description=${{ steps.metadata.outputs.project_name }} - standard image (alpine)
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.build_date }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.commit_id }}
            org.opencontainers.image.url=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.source=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.documentation=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            manifest:org.opencontainers.image.vendor=${{ forgejo.repository_owner }}
            manifest:org.opencontainers.image.authors=${{ forgejo.repository_owner }}
            manifest:org.opencontainers.image.title=${{ steps.metadata.outputs.project_name }}
            manifest:org.opencontainers.image.base.name=${{ steps.metadata.outputs.project_name }}
            manifest:org.opencontainers.image.description=${{ steps.metadata.outputs.project_name }} - standard image (alpine)
            manifest:org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            manifest:org.opencontainers.image.created=${{ steps.metadata.outputs.build_date }}
            manifest:org.opencontainers.image.revision=${{ steps.metadata.outputs.commit_id }}
            manifest:org.opencontainers.image.url=${{ forgejo.server_url }}/${{ forgejo.repository }}
            manifest:org.opencontainers.image.source=${{ forgejo.server_url }}/${{ forgejo.repository }}
            manifest:org.opencontainers.image.documentation=${{ forgejo.server_url }}/${{ forgejo.repository }}
            manifest:org.opencontainers.image.licenses=MIT

  build-devel:
    runs-on: docker
    if: forgejo.event_name == 'schedule' || (forgejo.event_name == 'push' && !startsWith(forgejo.ref, 'refs/tags/')) || (forgejo.event_name == 'workflow_dispatch' && !startsWith(forgejo.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to Container Registry
        env:
          REGISTRY_URL: ${{ forgejo.server_url }}
          REGISTRY_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          REGISTRY_HOST="${REGISTRY_URL#https://}"
          REGISTRY_HOST="${REGISTRY_HOST#http://}"
          REGISTRY_HOST="${REGISTRY_HOST%%/*}"
          echo "REGISTRY_HOST=$REGISTRY_HOST" >> "$GITHUB_ENV"
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY_HOST" -u "${{ forgejo.repository_owner }}" --password-stdin

      - name: Set build info
        id: metadata
        run: |
          # ghcr.io requires a lowercase image path
          echo "IMAGE_NAME=$(echo "${{ forgejo.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          PROJECT_NAME="${{ forgejo.event.repository.name }}"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"
          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          COMMIT_ID=$(git rev-parse --short=7 HEAD)
          echo "COMMIT_ID=$COMMIT_ID" >> "$GITHUB_ENV"
          echo "commit_id=$COMMIT_ID" >> "$GITHUB_OUTPUT"
          BUILD_EPOCH=$(date -u +%s)
          BUILD_DATE=$(date -u -d @$BUILD_EPOCH +"%Y-%m-%dT%H:%M:%SZ")
          echo "BUILD_EPOCH=$BUILD_EPOCH" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
          echo "build_epoch=$BUILD_EPOCH" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

      - name: Determine devel image tag
        id: tags
        run: echo "tags=$REGISTRY_HOST/${IMAGE_NAME}:devel" >> "$GITHUB_OUTPUT"

      - name: Build and push (devel)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=devel
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
            BUILD_EPOCH=${{ steps.metadata.outputs.build_epoch }}
            COMMIT_ID=${{ steps.metadata.outputs.commit_id }}
          labels: |
            org.opencontainers.image.vendor=${{ forgejo.repository_owner }}
            org.opencontainers.image.authors=${{ forgejo.repository_owner }}
            org.opencontainers.image.title=${{ steps.metadata.outputs.project_name }}-devel
            org.opencontainers.image.base.name=${{ steps.metadata.outputs.project_name }}
            org.opencontainers.image.description=${{ steps.metadata.outputs.project_name }} - development image (alpine, debug mode)
            org.opencontainers.image.version=devel
            org.opencontainers.image.created=${{ steps.metadata.outputs.build_date }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.commit_id }}
            org.opencontainers.image.url=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.source=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.documentation=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            manifest:org.opencontainers.image.vendor=${{ forgejo.repository_owner }}
            manifest:org.opencontainers.image.authors=${{ forgejo.repository_owner }}
            manifest:org.opencontainers.image.title=${{ steps.metadata.outputs.project_name }}-devel
            manifest:org.opencontainers.image.base.name=${{ steps.metadata.outputs.project_name }}
            manifest:org.opencontainers.image.description=${{ steps.metadata.outputs.project_name }} - development image (alpine, debug mode)
            manifest:org.opencontainers.image.version=devel
            manifest:org.opencontainers.image.created=${{ steps.metadata.outputs.build_date }}
            manifest:org.opencontainers.image.revision=${{ steps.metadata.outputs.commit_id }}
            manifest:org.opencontainers.image.url=${{ forgejo.server_url }}/${{ forgejo.repository }}
            manifest:org.opencontainers.image.source=${{ forgejo.server_url }}/${{ forgejo.repository }}
            manifest:org.opencontainers.image.documentation=${{ forgejo.server_url }}/${{ forgejo.repository }}
            manifest:org.opencontainers.image.licenses=MIT
