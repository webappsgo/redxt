name: Release

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create and release from the selected ref
        required: true
        type: string

concurrency:
  group: release-${{ forgejo.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_NAME: ${{ forgejo.event.repository.name }}
  RELEASE_TAG: ${{ inputs.tag || forgejo.ref_name }}

jobs:
  build:
    runs-on: docker
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Run release quality gates
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          go vet ./...
          staticcheck ./...
          govulncheck ./...
          go test ./...

      - name: Validate release tag
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tag '$RELEASE_TAG' must use vMAJOR.MINOR.PATCH format"
            exit 1
          fi

      - name: Set build info
        run: |
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "COMMIT_ID=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          BUILD_EPOCH=$(date -u +%s)
          echo "BUILD_EPOCH=$BUILD_EPOCH" >> "$GITHUB_ENV"
          # OFFICIAL_SITE (optional): site.txt wins; otherwise use repository secrets or leave empty
          # Never guess or assume - must be explicitly defined by user
          if [ -f site.txt ]; then
            echo "OFFICIAL_SITE=$(cat site.txt)" >> $GITHUB_ENV
          else
            echo "OFFICIAL_SITE=${{ secrets.OFFICIAL_SITE }}" >> $GITHUB_ENV
          fi

      - name: Build server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          LDFLAGS="-s -w -X 'main.Version=${VERSION}' -X 'main.CommitID=${COMMIT_ID}' -X 'main.BuildEpoch=${BUILD_EPOCH}' -X 'main.OfficialSite=${OFFICIAL_SITE}'"
          go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${{ env.PROJECT_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./src

      # CLI build - only if src/client/ directory exists
      - name: Build CLI
        if: hashFiles('src/client/**') != ''
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          LDFLAGS="-s -w -X 'main.Version=${VERSION}' -X 'main.CommitID=${COMMIT_ID}' -X 'main.BuildEpoch=${BUILD_EPOCH}' -X 'main.OfficialSite=${OFFICIAL_SITE}'"
          go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${{ env.PROJECT_NAME }}-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./src/client

      - name: Upload server artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.PROJECT_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 30

      - name: Upload CLI artifact
        if: hashFiles('src/client/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.PROJECT_NAME }}-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.PROJECT_NAME }}-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 30

      # Agent build - only if src/agent/ directory exists
      - name: Build Agent
        if: hashFiles('src/agent/**') != ''
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          LDFLAGS="-s -w -X 'main.Version=${VERSION}' -X 'main.CommitID=${COMMIT_ID}' -X 'main.BuildEpoch=${BUILD_EPOCH}' -X 'main.OfficialSite=${OFFICIAL_SITE}'"
          go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${{ env.PROJECT_NAME }}-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./src/agent

      - name: Upload Agent artifact
        if: hashFiles('src/agent/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.PROJECT_NAME }}-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.PROJECT_NAME }}-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 30

      # SBOM is release-level - generate once on the linux/amd64 leg (cyclonedx-gomod is pre-installed in the image)
      - name: Generate SBOM
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: cyclonedx-gomod mod -json -output ${{ env.PROJECT_NAME }}-sbom.cdx.json

      - name: Upload SBOM artifact
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.PROJECT_NAME }}-sbom
          path: ${{ env.PROJECT_NAME }}-sbom.cdx.json
          retention-days: 30

  release:
    needs: build
    runs-on: docker
    permissions:
      # create GitHub release + upload assets, plus tag ownership (Ensure release tag)
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # required: full history needed to inspect and push tags
          fetch-depth: 0
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Ensure release tag
        run: |
          tag="$RELEASE_TAG"
          if printf '%s' "$tag" | grep -qP '[[:space:][:cntrl:]]'; then
            echo "::error::Tag '$tag' contains whitespace or control characters and is not a valid GitHub tag name."
            exit 1
          fi
          # Delete existing tag (local + remote) then recreate at current HEAD
          git tag -d "$tag" 2>/dev/null || true
          git push origin ":refs/tags/$tag" 2>/dev/null || true
          git tag "$tag"
          git push origin "refs/tags/$tag"
          echo "Tag '$tag' ensured at $(git rev-parse HEAD)"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: binaries
          merge-multiple: true

      - name: Set version
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Create version.txt
        run: echo "$VERSION" > binaries/version.txt

      - name: Create source archive
        run: |
          tar --exclude='.git' --exclude='.github' --exclude='.gitea' \
            --exclude='binaries' --exclude='releases' --exclude='*.tar.gz' \
            -czf binaries/${{ env.PROJECT_NAME }}-${VERSION}-source.tar.gz .

      - name: Generate checksums
        run: |
          cd binaries
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' ! -name 'SHA512SUMS' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' ! -name 'SHA512SUMS' -print0 | sort -z | xargs -0 sha512sum > SHA512SUMS

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: binaries/*
          generate_release_notes: true
          make_latest: true
          token: ${{ secrets.FORGEJO_TOKEN }}
