# nginx proxy address - http://172.17.0.1:64580
# redxt - the complete DNS server

name: redxt

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  redxt:
    image: ghcr.io/webappsgo/redxt:latest
    container_name: redxt-app
    hostname: redxt
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      PORT: 80
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: redxt-app
      CACHE_URL: valkey://redxt-cache:6379
    volumes:
      - ./volumes/config:/config:z
      - ./volumes/data:/data:z
    ports:
      - "172.17.0.1:64580:80"
      # DNS listener ports (Do53 UDP/TCP, DoT/DoQ) — bound to all interfaces,
      # unlike the admin HTTP port above, since resolvers must reach these
      # directly on their standard well-known ports.
      - "53:53/tcp"
      - "53:53/udp"
      - "853:853/tcp"
      - "853:853/udp"
    healthcheck:
      test: ["CMD", "/usr/local/bin/redxt", "--status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      redxt-cache:
        condition: service_healthy
    networks:
      - redxt

  redxt-cache:
    image: valkey/valkey:alpine
    container_name: redxt-cache
    restart: always
    pull_policy: always
    logging: *default-logging
    volumes:
      - ./volumes/data/db/valkey:/data:z
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - redxt

networks:
  redxt:
    name: redxt
    external: false
